spring.application.name=employee-service
server.port=8085

spring.cloud.consul.host=${CONSUL_HOST}
spring.cloud.consul.port=${CONSUL_PORT}

spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true


spring.datasource.url=${EMPLOYEE_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Tracing
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}

# Metrics
# Don't send metrics through Micrometer's OTLP registry
management.otlp.metrics.export.enabled=false

#secrete
app.jwt.secret=${JWT_SECRET}
internal.auth.service-name=auth-service
internal.auth.service-key=${INTERNAL_SERVICE_KEY}


logging.file.name=../logs/employee-service.log