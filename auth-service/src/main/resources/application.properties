spring.application.name=auth-service

server.port=8090

# MySQL
#--------------------------------------------------------------
spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
#---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#ACTUATOR
#-----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus


# OPEN TELEMETRY
#----------------------------------------------------------------------------
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}

# Metrics
# Don't send metrics through Micrometer's OTLP registry
#------------------------------------------------------------------------------
management.otlp.metrics.export.enabled=false

# Consul
#-------------------------------------------------------------------------------
spring.cloud.consul.host=${CONSUL_HOST}
spring.cloud.consul.port=${CONSUL_PORT}
spring.cloud.consul.discovery.register=true


#admin credential
#-------------------------------------------------------------------------------
app.initial-admin.username=${AUTH_ADMIN_USERNAME}
app.initial-admin.email=${AUTH_ADMIN_EMAIL}
app.initial-admin.password=${AUTH_ADMIN_PASSWORD}

#jwt
#-------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# Internal Service Authentication
#--------------------------------------------------------------------------------
internal.auth.service-name=auth-service
internal.auth.service-key=${INTERNAL_SERVICE_KEY}